name: CI devops 2025
on:
  # Run CI when code is pushed to either development branch.
  push:
    branches:
      - main
  # Validate proposed changes before they are merged into either branch.
  pull_request:

jobs:
  test-backend:
    # GitHub-hosted Ubuntu includes Docker for the PostgreSQL Testcontainers tests.
    runs-on: ubuntu-24.04
    steps:
      # Check out the repository so the wrapper and backend sources are available.
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        # Use the Java version required by the Spring Boot backend and cache Maven dependencies.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify runs unit tests and the Failsafe integration tests configured in the POM.
      # Call the wrapper through Bash because it is not marked executable in Git.
      - name: Build and test backend
        working-directory: backend/simpleapi
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

  build-and-push-docker-image:
      needs: test-backend
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      runs-on: ubuntu-24.04
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        # 1. Backend
        - name: Build image and push backend
          uses: docker/build-push-action@v6
          with:
            context: ./backend/simpleapi
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-backend:latest
            push: ${{ github.ref == 'refs/heads/main' }}

        # 2. Database
        - name: Build image and push database
          uses: docker/build-push-action@v6
          with:
            context: ./database
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-database:latest
            push: ${{ github.ref == 'refs/heads/main' }}

        # 3. HTTPD (Frontend / Reverse Proxy)
        - name: Build image and push httpd
          uses: docker/build-push-action@v6
          with:
            context: ./httpd
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-httpd:latest
            push: ${{ github.ref == 'refs/heads/main' }}