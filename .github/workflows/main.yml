name: CI devops 2025
on:
  # Run CI when code is pushed to either development branch.
  push:
    branches:
      - main
      - develop
  # Validate proposed changes before they are merged into either branch.
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    # GitHub-hosted Ubuntu includes Docker for the PostgreSQL Testcontainers tests.
    runs-on: ubuntu-24.04
    steps:
      # Check out the repository so the wrapper and backend sources are available.
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        # Use the Java version required by the Spring Boot backend and cache Maven dependencies.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify runs unit tests and the Failsafe integration tests configured in the POM.
      # Call the wrapper through Bash because it is not marked executable in Git.
      - name: Build and test backend
        working-directory: backend/simpleapi
        run: bash ./mvnw --batch-mode --no-transfer-progress verify